name: Library and PDF checks
on:
  pull_request:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Detect package version change across the entire push
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/release/check.cjs
  canvaskit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: node scripts/canvaskit/verify.cjs
      - name: Rebuild pinned Google Skia and compare shipped artifacts
        run: node scripts/canvaskit/build.cjs --check
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint
  pdf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: docker build -t html2pdf-tests -f tests/pdf/Dockerfile .
      - name: Export, inspect, compare images and test package
        run: >-
          docker run --rm --mount "type=bind,source=$PWD,target=/work"
          --mount type=volume,source=html2pdf-test-deps,target=/work/node_modules
          html2pdf-tests bash -lc
          "npm ci --ignore-scripts && npm run test:pdf && npm run test:pdf:visual && npm run build && npm run test:package"
      - run: npm ci --ignore-scripts
      - name: Validate PDF/UA-1
        run: npm run test:pdf:validate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: .cache/npm-package/package.tgz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pdf-test-results
          path: .cache/pdf-tests/
          if-no-files-found: error
  publish:
    needs: [release-version, canvaskit, unit, pdf]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: npm
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install pinned npm CLI with trusted publishing support
        run: npm install --global npm@11.21.0 --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: .cache/npm-package
      - name: Refuse an already published version or registry lookup failure
        run: node scripts/release/check.cjs --registry-check
      - name: Publish tested archive using npm Trusted Publishing
        env:
          RELEASE_TAG: ${{ needs.release-version.outputs.tag }}
        run: npm publish .cache/npm-package/package.tgz --ignore-scripts --access public --tag "$RELEASE_TAG"
